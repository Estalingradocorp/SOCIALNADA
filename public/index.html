<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ecT — solo fotos y GIFs</title>
<link rel="icon" href="https://64.media.tumblr.com/e23f88de568aa9048ac614f06733775a/b67f3092c2d53e2e-0f/s400x600/9dd0ed927c80754ecb77c531ab1bb6783115b7bd.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <div class="logo" id="logo"><img src="https://64.media.tumblr.com/e23f88de568aa9048ac614f06733775a/b67f3092c2d53e2e-0f/s400x600/9dd0ed927c80754ecb77c531ab1bb6783115b7bd.jpg" alt="ecT" referrerpolicy="no-referrer" onerror="this.style.display='none'"><span>ecT</span></div>
  <div class="search"><input id="q" placeholder="Buscar en ecT"></div>
  <div class="navr" id="navr"></div>
</nav>

<div class="wrap">
<main>
  <div id="profile-view" class="hide"></div>
  <div id="home-view">
    <div class="card composer">
      <div class="dropzone" id="dropzone">
        <b>Sube una foto o un GIF</b><br>
        <span>Arrastra aquí o haz clic · PNG, JPG, WebP, GIF (máx. 5 MB en localStorage)</span>
      </div>
      <input id="f-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="hide">
      <div class="preview-wrap hide" id="preview-wrap">
        <img id="preview" alt="Vista previa">
        <span class="gif-badge hide" id="gif-badge">GIF</span>
        <button class="clear-img" id="clear-img" type="button">✕ quitar</button>
      </div>
      <textarea id="f-caption" rows="2" placeholder="Pie de foto (opcional)..."></textarea>
      <input id="f-tags" type="text" placeholder="#etiquetas separadas por espacios">
      <div class="err" id="post-err"></div>
      <div class="row"><small class="hint">Solo imágenes y GIFs — se guardan en tu navegador (localStorage)</small><button class="btn" id="post-btn">Publicar</button></div>
    </div>
    <div id="filter" class="filter hide"></div>
    <div id="feed"></div>
  </div>
</main>

<aside class="side">
  <div class="card"><h4>Radar</h4><div id="recs"></div></div>
  <div class="card"><h4>Tendencias</h4><div id="trends"></div></div>
</aside>
</div>

<div class="modal hide" id="auth-modal">
  <div class="modal-box">
    <button class="close-x" id="auth-close">✕</button>
    <h3 id="auth-title">Entra a ecT</h3>
    <p class="sub">Elige un nombre. Se guarda solo en tu navegador.</p>
    <div class="tabs">
      <button id="tab-login" class="on">Entrar</button>
      <button id="tab-register">Crear cuenta</button>
    </div>
    <form id="auth-form">
      <label>@usuario</label>
      <input id="a-user" type="text" autocomplete="username" placeholder="tu_nombre" required>
      <div class="err" id="auth-err"></div>
      <button class="btn" id="auth-btn" type="submit">Entrar</button>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
